[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-skill-framework"
version = "0.1.0"
description = "Python MCP service framework for pluggable skill tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
mcp-skill-framework = "mcp_skill_framework.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
